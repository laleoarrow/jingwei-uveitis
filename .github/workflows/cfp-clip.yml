name: CFP Crop packages
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/cfp-clip/**'
      - '.github/workflows/cfp-clip.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/cfp-clip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests
      - run: node --check static/app.js
      - run: python build_release.py --native
      - name: Check packaged Windows app
        run: python tests/smoke_package.py "build/native/JingWei-CFP-Crop.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: CFP-Crop-Windows
          path: tools/cfp-clip/dist/*.zip
          if-no-files-found: error
